services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spx_task_tracker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spx_task_tracker"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - tasktracker_pg:/var/lib/postgresql/data

volumes:
  tasktracker_pg:
